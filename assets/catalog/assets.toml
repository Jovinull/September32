#  September 32 — third-party asset manifest
#  ==========================================
#
#  This file is a legal record, not a build artefact. It is written and reviewed
#  by hand; no tool rewrites it. Everything a tool discovers (SHA-256 hashes,
#  timestamps, which files were imported) goes into the generated companion
#  `acquisition.toml` in this directory, and the two are merged at load time.
#
#  Rules
#  -----
#  * Every third-party file that touches this project has an entry here, and
#    every entry has evidence under `assets/evidence/<id>/`.
#  * `license_name` records a licence, never a payment model. "Royalty-free" is
#    not a licence; the concrete permissions are the boolean fields below.
#  * Free is not public domain. `license_verified` is the date a human read the
#    terms; the evidence directory holds what they read.
#  * `redistribution_allowed = false` means the files must never be committed to
#    this repository, in original OR modified form. `.gitignore` enforces it,
#    but the reason lives here.
#
#  Generated from this file:
#      CREDITS.md, THIRD_PARTY_NOTICES.md, game/credits.txt,
#      and the in-game Credits screen.
#  Regenerate with `s32 assets credits`; CI fails if they are stale.

