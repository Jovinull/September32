[project]
name = "september-32"
version = "0.1.0"
description = "Development toolchain and narrative engine for the visual novel September 32."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "September 32 Team" }]
# Runtime engine dependencies must stay EMPTY: `s32_engine` is imported by
# Ren'Py, which ships its own interpreter and cannot install wheels.
# Everything below is development tooling only.
dependencies = []

[project.optional-dependencies]
tools = [
  "jsonschema>=4.23",
  "pillow>=11.0",
  "tomli-w>=1.1",
]

[project.scripts]
s32 = "s32tools.cli:main"

[dependency-groups]
dev = [
  "jsonschema>=4.23",
  "pillow>=11.0",
  "tomli-w>=1.1",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "hypothesis>=6.120",
  "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["game/python-packages/s32_engine", "tools/s32tools"]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
package = true

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["game/python-packages", "tools", "tests"]
extend-exclude = [".tools", "assets", "game/cache", "research"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "B",           # flake8-bugbear
  "A",           # flake8-builtins
  "C4",          # comprehensions
  "DTZ",         # naive datetimes
  "T20",         # no stray print() outside CLI
  "SIM",         # simplify
  "PTH",         # use pathlib
  "RET",         # return conventions
  "ARG",         # unused arguments
  "PL",          # pylint subset
  "RUF",
  "D",           # pydocstyle
]
ignore = [
  "D107",   # __init__ docstring: the class docstring covers it
  "D203",   # incompatible with D211
  "D213",   # incompatible with D212
  "PLR0913", # narrative functions legitimately take several dimensions
  "PLR2004", # magic values are readable in tests and score maths
]

[tool.ruff.lint.per-file-ignores]
# Tests: docstrings on every test are noise, `assert` is the point, and a
# pytest fixture that is requested purely for its side effect looks like an
# unused argument to a linter.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "S101", "PLR0915", "ARG001", "PLC0415"]
# The tooling package IS the command line; printing is its output. So are the
# developer scripts.
"tools/s32tools/**" = ["T20"]
"scripts/*" = ["T20", "PLC0415"]
# The CLI and doctor import their handlers lazily. That is deliberate: `s32
# doctor` should not pay to import Pillow, jsonschema and the simulator in
# order to tell you the Ren'Py SDK is missing, and lazy imports also break the
# cycle between the CLI and the modules that read paths from it.
"tools/s32tools/cli.py" = ["PLC0415"]
"tools/s32tools/doctor.py" = ["PLC0415"]
# These defer imports to break real cycles, not to save startup time: the
# validators import the engine's state builder, which imports the effects
# grammar, which the validators also parse.
"tools/s32tools/validation/content.py" = ["PLC0415"]
"tools/s32tools/simulation/simulator.py" = ["PLC0415"]
# The engine defers two imports to break genuine circular dependencies
# (state <-> commitments, state <-> types). Hoisting them would not work.
"game/python-packages/s32_engine/state.py" = ["PLC0415"]
# The SDK helper defers its hashing import so that `locate()` — the only part
# most callers need — does not drag in the asset tooling.
"tools/s32tools/renpy_sdk.py" = ["PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["s32_engine", "s32tools"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["game/python-packages/s32_engine", "tools/s32tools", "tests"]
mypy_path = "game/python-packages"
strict = true
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true
pretty = true
exclude = ['^\.tools/', '^assets/', '^research/']

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true

# Tests are checked, but not required to annotate themselves. `strict` on a test
# suite means writing `-> None` on three hundred functions and annotating every
# pytest fixture, which buys nothing: the tests are not an API, and their bodies
# are still type-checked against the code they exercise.
[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
check_untyped_defs = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: long-running simulation tests",
  "assets: requires third-party assets to be installed locally",
]
filterwarnings = ["error"]
